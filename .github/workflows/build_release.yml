name: Build and Release

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build GoobyDDNS executable
        shell: powershell
        run: |
          pyinstaller --onefile --noconsole `
            --icon "assets/icon.ico" `
            --hidden-import requests `
            --hidden-import pystray `
            --hidden-import PIL `
            --add-data "template.ini;." `
            --add-data "assets/icon.ico;assets" `
            --name GoobyDDNS app.py

      - name: Prepare release payload
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item "dist\GoobyDDNS.exe" -Destination "release\GoobyDDNS.exe"
          Get-ChildItem "release"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: GoobyDDNS-Windows
          path: release/GoobyDDNS.exe

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: GoobyDDNS Build ${{ github.run_number }}
          files: release/GoobyDDNS.exe
          generate_release_notes: true
